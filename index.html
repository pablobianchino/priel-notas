    <style>

        .nota-contenido ol { list-style-type: decimal; padding-left: 1.25rem; margin-top: 0.25rem; }

        .folder-ghost { opacity: 0.4; background-color: #1e293b; border: 1px dashed #64748b; }
    </style>
</head>

            <div class="flex-1 max-w-2xl relative">
                <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="buscador" oninput="renderizarNotas()" placeholder="Buscar notas..." class="w-full bg-[#0f1115] border border-slate-700 text-slate-300 text-sm rounded-lg pl-9 pr-4 py-2 outline-none focus:border-blue-500 transition-colors">

                <span id="contador-vista" class="text-sm font-medium text-slate-400">0 notas</span>
            </div>

            <!-- GRILLA DE NOTAS -->
            <div id="grid-notas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 items-start">
                <!-- Se inyectan dinámicamente -->
            </div>
        </div>
    </main>

    <script>
        const CURRENT_VERSION = 'v3.2.0';
        const supabaseUrl = 'https://uzqkdeijzqyruqscyivb.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6cWtkZWlqenF5cnVxc2N5aXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjA1NjMsImV4cCI6MjA5MjA5NjU2M30.YbjZy5tz6TNStXl9-OMscv4Ay64A5_xrFf_pZiNBaP4';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let notas = [];
        let etiquetasBD = []; 
        let user = null;
        let idNotaEditando = null;
        let vistaActual = 'inbox';
        
        let timerAutoGuardado = null;
        let estadoUltimoGuardado = '';
        
        let modoCarpetaActual = 'crear'; // 'crear' o 'renombrar'
        let carpetaActivaMenu = null;
        let sortableCarpetasInstance = null;

        const quillConfig = {
            theme: 'snow', placeholder: 'Escribe el texto de tu nota...',
            modules: { toolbar: [ ['bold', 'italic', 'underline', 'strike'], [{'list': 'ordered'}, {'list': 'bullet'}], ['clean'] ] }
        };
        var quill = new Quill('#editor-container', quillConfig);
        var editQuill = new Quill('#edit-editor-container', quillConfig);

        // INTERCEPTOR DE PORTAPAPELES
        document.addEventListener('copy', function(e) {
            const selection = window.getSelection();
            if (!selection || !selection.rangeCount) return;
            const anchorNode = selection.anchorNode;
            if (!anchorNode) return;
            const editorEl = anchorNode.nodeType === 1 ? anchorNode.closest('.ql-editor') : anchorNode.parentElement?.closest('.ql-editor');
            if (!editorEl) return;

            const range = selection.getRangeAt(0);
            const fragment = range.cloneContents();
            
            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute'; tempDiv.style.left = '-9999px'; tempDiv.style.whiteSpace = 'pre-wrap';
            tempDiv.appendChild(fragment);

            tempDiv.querySelectorAll('.ql-align-center').forEach(el => el.style.textAlign = 'center');
            tempDiv.querySelectorAll('.ql-align-right').forEach(el => el.style.textAlign = 'right');
            tempDiv.querySelectorAll('.ql-align-justify').forEach(el => el.style.textAlign = 'justify');

            tempDiv.querySelectorAll('p').forEach(p => {
                const div = document.createElement('div');
                div.innerHTML = p.innerHTML; div.style.cssText = p.style.cssText;
                div.style.margin = '0'; div.style.padding = '0';
                p.parentNode.replaceChild(div, p);
            });

            document.body.appendChild(tempDiv);
            const htmlContent = tempDiv.innerHTML;
            const plainText = tempDiv.innerText;
            document.body.removeChild(tempDiv);

            if (e.clipboardData) {
                e.clipboardData.setData('text/html', htmlContent);
                e.clipboardData.setData('text/plain', plainText);
                e.preventDefault();
            }
        });

        // Ocultar menú contextual al hacer clic fuera
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('folder-context-menu');
            if (!menu.contains(e.target) && !e.target.closest('.btn-3-dots')) {
                menu.classList.add('opacity-0', 'scale-95');
                setTimeout(() => menu.classList.add('hidden'), 150);
            }
        });

        const paletas = [
            'bg-purple-900/50 text-purple-300 border-purple-700/50', 'bg-blue-900/50 text-blue-300 border-blue-700/50',
            'bg-green-900/50 text-green-300 border-green-700/50', 'bg-teal-900/50 text-teal-300 border-teal-700/50',
            'bg-indigo-900/50 text-indigo-300 border-indigo-700/50', 'bg-orange-900/50 text-orange-300 border-orange-700/50',
            'bg-yellow-900/40 text-yellow-300 border-yellow-700/50', 'bg-pink-900/50 text-pink-300 border-pink-700/50'
        ];

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                user = session.user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('main-app').classList.add('flex');
                await inicializarDatos();
            } else {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                const errEl = document.getElementById('auth-error');
                errEl.innerText = error.message; errEl.classList.remove('hidden');
            } else {
                user = data.user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('loading-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('main-app').classList.add('flex');
                await inicializarDatos();
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            user = null; notas = []; etiquetasBD = [];
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('main-app').classList.remove('flex');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('email').value = ''; document.getElementById('password').value = '';
        }

        async function inicializarDatos() {
            const resEtq = await supabaseClient.from('etiquetas').select('*').order('orden', { ascending: true });
            if (!resEtq.error) etiquetasBD = resEtq.data;

            const resNotas = await supabaseClient.from('notas').select('*').order('created_at', { ascending: false });
            if (!resNotas.error) { 
                notas = resNotas.data; 
                let promesasAlineacion = [];
                
                notas.forEach(n => {
                    if (n.tablero === 'general' || n.tablero === 'cerrado') {
                        n.tablero = 'inbox';
                        promesasAlineacion.push(supabaseClient.from('notas').update({ tablero: 'inbox' }).eq('id', n.id));
                    }
                    if (n.tablero !== 'inbox' && (!n.etiquetas || n.etiquetas[0] !== n.tablero)) {
                        n.etiquetas = [n.tablero];
                        promesasAlineacion.push(supabaseClient.from('notas').update({ etiquetas: [n.tablero] }).eq('id', n.id));
                    }
                });
                if(promesasAlineacion.length > 0) await Promise.all(promesasAlineacion);
            }
            
            renderizarSidebar();
            renderizarNotas();
            document.getElementById('loading-screen').classList.add('hidden');
        }

        function cambiarVista(nombre) {
            vistaActual = nombre;
            if(window.innerWidth < 768) toggleSidebar();
            document.getElementById('buscador').value = '';
            renderizarSidebar();
            renderizarNotas();
        }

        // --- GESTIÓN DE CARPETAS (SIDEBAR) ---
        function renderizarSidebar() {
            const nav = document.getElementById('nav-carpetas');
            let notasInbox = notas.filter(n => n.tablero === 'inbox').length;
            
            let html = `
                <div role="button" onclick="cambiarVista('inbox')" ondragover="dragOverCarpeta(event)" ondragleave="dragLeaveCarpeta(event)" ondrop="dropNota(event, 'inbox')" class="flex items-center justify-between px-3 py-2 rounded-lg transition-colors border border-transparent cursor-pointer ${vistaActual === 'inbox' ? 'nav-item-active' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}">
                    <div class="flex items-center gap-3 pointer-events-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <span class="font-semibold text-sm">Inbox</span>
                    </div>
                    ${notasInbox > 0 ? `<span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full pointer-events-none">${notasInbox}</span>` : ''}
                </div>
                
                <div class="flex items-center justify-between pt-4 pb-1 px-3">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Carpetas</p>
                    <button onclick="abrirModalCrearCarpeta()" class="text-slate-400 hover:text-white transition-colors" title="Nueva Carpeta"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></button>
                </div>
                <div id="lista-carpetas-sortable" class="flex flex-col gap-1">
            `;

            etiquetasBD.forEach(e => {
                let isActive = vistaActual === e.nombre;
                let notasCount = notas.filter(n => n.tablero === e.nombre).length;
                let colorBase = e.color.split(' ')[0].replace('bg-', 'text-').replace('/50','').replace('/40','');

                html += `
                    <div data-nombre="${e.nombre}" class="group flex items-center justify-between px-3 py-1.5 rounded-lg transition-colors border border-transparent cursor-pointer ${isActive ? 'nav-item-active' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}" ondragover="dragOverCarpeta(event)" ondragleave="dragLeaveCarpeta(event)" ondrop="dropNota(event, '${e.nombre}')">
                        <div onclick="cambiarVista('${e.nombre}')" class="flex-1 flex items-center gap-3 py-0.5 pointer-events-none">
                            <svg class="w-4 h-4 ${colorBase}" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                            <span class="font-medium text-sm truncate w-28">${e.nombre}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${notasCount > 0 ? `<span class="text-slate-500 text-[10px] font-bold pointer-events-none ${isActive ? 'hidden group-hover:hidden' : 'group-hover:hidden'}">${notasCount}</span>` : ''}
                            <button onclick="abrirMenuContextual(event, '${e.nombre}')" class="btn-3-dots p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors opacity-0 group-hover:opacity-100 ${isActive ? 'opacity-100' : ''}">
                                <svg class="w-4 h-4 pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`; // Cierra sortable container
            nav.innerHTML = html;

            let selectOpts = `<option value="inbox">Inbox</option>`;
            etiquetasBD.forEach(e => selectOpts += `<option value="${e.nombre}">${e.nombre}</option>`);
            if(document.getElementById('tablero-crear')) document.getElementById('tablero-crear').innerHTML = selectOpts;
            if(document.getElementById('tablero-editar')) document.getElementById('tablero-editar').innerHTML = selectOpts;

            inicializarSortableCarpetas();
        }

        function inicializarSortableCarpetas() {
            const container = document.getElementById('lista-carpetas-sortable');
            if (!container) return;
            if (sortableCarpetasInstance) sortableCarpetasInstance.destroy();
            
            sortableCarpetasInstance = new Sortable(container, {
                animation: 150,
                delay: 150, // Delay para touch (evita que arrastre al scrollear)
                delayOnTouchOnly: true,
                ghostClass: 'folder-ghost',
                onEnd: async function() {
                    await actualizarOrdenCarpetas();
                }
            });
        }

        async function actualizarOrdenCarpetas() {
            const container = document.getElementById('lista-carpetas-sortable');
            const items = Array.from(container.children);
            let promesas = [];

            items.forEach((item, index) => {
                const nombreCarpeta = item.dataset.nombre;
                const etiqueta = etiquetasBD.find(e => e.nombre === nombreCarpeta);
                if (etiqueta && (etiqueta.orden || 0) !== index) {
                    etiqueta.orden = index;
                    promesas.push(supabaseClient.from('etiquetas').update({ orden: index }).eq('id', etiqueta.id));
                }
            });

            etiquetasBD.sort((a, b) => (a.orden || 0) - (b.orden || 0));
            if(promesas.length > 0) await Promise.all(promesas);
        }

        function abrirMenuContextual(e, nombreCarpeta) {
            e.stopPropagation(); e.preventDefault();
            carpetaActivaMenu = nombreCarpeta;
            const menu = document.getElementById('folder-context-menu');
            
            const colorContainer = document.getElementById('folder-color-options');
            colorContainer.innerHTML = paletas.map(p => {
                return `<div onclick="cambiarColorCarpeta('${p}')" class="w-6 h-6 rounded-full cursor-pointer hover:scale-110 transition-transform ${p.split(' ')[0]} border ${p.split(' ')[2]} mx-auto"></div>`;
            }).join('');
            
            const rect = e.currentTarget.getBoundingClientRect();
            // Ajuste responsivo de la posición
            if(window.innerWidth < 768) {
                menu.style.top = `${rect.bottom + window.scrollY + 5}px`;
                menu.style.left = `${rect.left + window.scrollX + 20}px`;
                menu.classList.replace('origin-top-right', 'origin-top-left');
            } else {
                menu.style.top = `${rect.bottom + window.scrollY + 5}px`;
                menu.style.left = `${rect.left + window.scrollX - 180}px`; 
                menu.classList.replace('origin-top-left', 'origin-top-right');
            }
            
            menu.classList.remove('hidden');
            setTimeout(() => menu.classList.remove('opacity-0', 'scale-95'), 10);
        }

        function abrirModalCrearCarpeta() {
            modoCarpetaActual = 'crear';
            document.getElementById('titulo-modal-carpeta').innerText = 'Nueva Carpeta';
            document.getElementById('input-nombre-carpeta').value = '';
            document.getElementById('modal-input-carpeta').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-nombre-carpeta').focus(), 100);
        }

        function abrirModalRenombrarCarpeta() {
            const menu = document.getElementById('folder-context-menu');
            menu.classList.add('opacity-0', 'scale-95');
            setTimeout(() => menu.classList.add('hidden'), 150);

            modoCarpetaActual = 'renombrar';
            document.getElementById('titulo-modal-carpeta').innerText = 'Renombrar Carpeta';
            document.getElementById('input-nombre-carpeta').value = carpetaActivaMenu;
            document.getElementById('modal-input-carpeta').classList.remove('hidden');
            setTimeout(() => document.getElementById('input-nombre-carpeta').focus(), 100);
        }

        function cerrarModalCarpeta() {
            document.getElementById('modal-input-carpeta').classList.add('hidden');
        }

        async function guardarCarpetaBD() {
            const input = document.getElementById('input-nombre-carpeta');
            const nuevoNombre = input.value.trim();
            if (!nuevoNombre) return;

            if (modoCarpetaActual === 'crear') {
                if (etiquetasBD.some(e => e.nombre.toLowerCase() === nuevoNombre.toLowerCase())) { alert("La carpeta ya existe."); return; }
                const colorRandom = paletas[Math.floor(Math.random() * paletas.length)];
                const ordenNuevo = etiquetasBD.length;
                const { data, error } = await supabaseClient.from('etiquetas').insert([{ nombre: nuevoNombre, color: colorRandom, user_id: user.id, orden: ordenNuevo }]).select();
                if (!error) { 
                    etiquetasBD.push(data[0]); 
                    renderizarSidebar(); cerrarModalCarpeta(); 
                }
            } else if (modoCarpetaActual === 'renombrar') {
                if (nuevoNombre === carpetaActivaMenu) { cerrarModalCarpeta(); return; }
                const id = etiquetasBD.find(e => e.nombre === carpetaActivaMenu).id;
                const { error } = await supabaseClient.from('etiquetas').update({ nombre: nuevoNombre }).eq('id', id);
                if (!error) {
                    etiquetasBD.find(e => e.id === id).nombre = nuevoNombre;
                    let promesas = [];
                    notas.forEach(n => {
                        if (n.tablero === carpetaActivaMenu || (n.etiquetas && n.etiquetas.includes(carpetaActivaMenu))) {
                            if(n.tablero === carpetaActivaMenu) n.tablero = nuevoNombre;
                            if(n.etiquetas && n.etiquetas.includes(carpetaActivaMenu)) n.etiquetas = [nuevoNombre];
                            promesas.push(supabaseClient.from('notas').update({ tablero: n.tablero, etiquetas: n.etiquetas }).eq('id', n.id));
                        }
                    });
                    if(promesas.length) await Promise.all(promesas);
                    if(vistaActual === carpetaActivaMenu) vistaActual = nuevoNombre;
                    renderizarSidebar(); renderizarNotas(); cerrarModalCarpeta();
                }
            }
        }

        async function cambiarColorCarpeta(colorClass) {
            if(!carpetaActivaMenu) return;
            const id = etiquetasBD.find(e => e.nombre === carpetaActivaMenu).id;
            
            const menu = document.getElementById('folder-context-menu');
            menu.classList.add('opacity-0', 'scale-95');
            setTimeout(() => menu.classList.add('hidden'), 150);
            
            etiquetasBD.find(e => e.id === id).color = colorClass;
            renderizarSidebar(); renderizarNotas();
            await supabaseClient.from('etiquetas').update({color: colorClass}).eq('id', id);
        }

        async function eliminarCarpetaBD() {
            const menu = document.getElementById('folder-context-menu');
            menu.classList.add('opacity-0', 'scale-95');
            setTimeout(() => menu.classList.add('hidden'), 150);

            if (!confirm(`¿Borrar carpeta "${carpetaActivaMenu}"? Sus notas se moverán al Inbox.`)) return;
            
            const id = etiquetasBD.find(e => e.nombre === carpetaActivaMenu).id;
            const { error } = await supabaseClient.from('etiquetas').delete().eq('id', id);
            
            if (!error) {
                etiquetasBD = etiquetasBD.filter(e => e.id !== id);
                let promesas = [];
                notas.forEach(n => {
                    if (n.tablero === carpetaActivaMenu || (n.etiquetas && n.etiquetas.includes(carpetaActivaMenu))) {
                        n.tablero = 'inbox'; n.etiquetas = [];
                        promesas.push(supabaseClient.from('notas').update({ tablero: 'inbox', etiquetas: [] }).eq('id', n.id));
                    }
                });
                if(promesas.length) await Promise.all(promesas);
                if(vistaActual === carpetaActivaMenu) vistaActual = 'inbox';
                renderizarSidebar(); renderizarNotas();
            }
        }

        // --- DRAG AND DROP NATIVO (NOTAS -> CARPETAS) ---
        function dragStartNota(e, id) {
            e.dataTransfer.setData("nota_id", id);
            e.currentTarget.classList.add('opacity-40', 'scale-95');
        }
        function dragEndNota(e) {
            e.currentTarget.classList.remove('opacity-40', 'scale-95');
            document.querySelectorAll('.drag-over-folder').forEach(el => el.classList.remove('drag-over-folder'));
        }
        function dragOverCarpeta(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over-folder');
        }
        function dragLeaveCarpeta(e) {
            e.currentTarget.classList.remove('drag-over-folder');
        }
        function dragOverInbox(e) { e.preventDefault(); }
        function dragLeaveInbox(e) { }

        async function dropNota(e, carpetaDestino) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over-folder');
            
            const idNota = e.dataTransfer.getData("nota_id");
            if (!idNota) return;

            const nota = notas.find(n => n.id === idNota);
            if (!nota || nota.tablero === carpetaDestino) return;

            nota.tablero = carpetaDestino;
            nota.etiquetas = carpetaDestino !== 'inbox' ? [carpetaDestino] : [];
            
            renderizarSidebar(); 
            renderizarNotas();
            
            await supabaseClient.from('notas').update({ 
                tablero: nota.tablero, 
                etiquetas: nota.etiquetas 
            }).eq('id', idNota);
        }

        // --- RENDERIZADO DE NOTAS ---
        function renderizarNotas() {
            const grid = document.getElementById('grid-notas');
            grid.innerHTML = '';
            
            document.getElementById('titulo-vista').innerText = vistaActual;
            const term = document.getElementById('buscador').value.toLowerCase();
            const tempDiv = document.createElement('div');
            
            let filtradas = notas.filter(n => n.tablero === vistaActual);

            if (term) {
                filtradas = notas.filter(n => {
                    tempDiv.innerHTML = n.texto;
                    const txt = tempDiv.innerText.toLowerCase();
                    const tit = (n.titulo || '').toLowerCase();
                    return txt.includes(term) || tit.includes(term);
                });
                document.getElementById('titulo-vista').innerText = `Búsqueda: "${term}"`;
            }

            document.getElementById('contador-vista').innerText = `${filtradas.length} notas`;

            filtradas.forEach(nota => {
                const el = document.createElement('div');
                el.className = `bg-[#1a1d24] rounded-xl border border-slate-700/60 p-5 hover:border-slate-500 transition-colors group flex flex-col shadow-sm h-full cursor-grab`;
                el.draggable = true;
                el.ondragstart = (e) => dragStartNota(e, nota.id);
                el.ondragend = dragEndNota;
                
                let badge = '';
                if(nota.etiquetas && nota.etiquetas.length > 0 && vistaActual === 'inbox') {
                    let dbTag = etiquetasBD.find(e => e.nombre === nota.etiquetas[0]);
                    let claseColor = dbTag ? dbTag.color : 'bg-slate-700 text-slate-300 border-slate-600';
                    badge = `<span class="text-[10px] font-medium px-2 py-0.5 rounded border ${claseColor}">${nota.etiquetas[0]}</span>`;
                }

                let btnAccion = '';
                if(vistaActual === 'inbox') {
                    btnAccion = `<button onclick="archivarNota('${nota.id}', event)" class="p-1.5 text-slate-400 hover:text-blue-400 hover:bg-slate-800 rounded transition-colors" title="Archivar en su carpeta"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg></button>`;
                } else {
                    btnAccion = `<button onclick="moverAInbox('${nota.id}', event)" class="p-1.5 text-slate-400 hover:text-yellow-400 hover:bg-slate-800 rounded transition-colors" title="Mover a Inbox"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg></button>`;
                }

                el.innerHTML = `
                    <div class="flex justify-between items-start mb-3 h-6">
                        ${badge}
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-auto">
                            ${btnAccion}
                            <button onclick="eliminarNota('${nota.id}', event)" class="p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded transition-colors" title="Eliminar nota"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                    <div class="flex-1 overflow-hidden" onclick="abrirModalEdicion('${nota.id}')">
                        <h3 class="font-bold text-slate-100 text-base mb-2">${nota.titulo || 'Nota sin título'}</h3>
                        <div class="text-slate-400 text-sm leading-relaxed line-clamp-6 nota-contenido pointer-events-none">${nota.texto}</div>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        async function archivarNota(id, event) {
            event.stopPropagation();
            const nota = notas.find(n => n.id === id);
            if(nota.etiquetas && nota.etiquetas.length > 0 && nota.etiquetas[0] !== 'inbox') {
                nota.tablero = nota.etiquetas[0];
                renderizarSidebar(); renderizarNotas();
                await supabaseClient.from('notas').update({ tablero: nota.tablero }).eq('id', id);
            } else {
                alert("Para archivar esta nota, primero asignale una carpeta editándola.");
            }
        }

        async function moverAInbox(id, event) {
            event.stopPropagation();
            const nota = notas.find(n => n.id === id);
            nota.tablero = 'inbox';
            renderizarSidebar(); renderizarNotas();
            await supabaseClient.from('notas').update({ tablero: 'inbox' }).eq('id', id);
        }

        async function eliminarNota(id, event) {
            event.stopPropagation();
            if(!confirm("¿Seguro que querés eliminar esta nota?")) return;
            notas = notas.filter(n => n.id !== id);
            renderizarSidebar(); renderizarNotas();
            await supabaseClient.from('notas').delete().eq('id', id);
        }

        function abrirModalCrear() {
            document.getElementById('modal-crear').classList.remove('hidden');
            document.getElementById('tablero-crear').value = vistaActual === 'inbox' ? 'inbox' : vistaActual;
            setTimeout(() => quill.focus(), 100);
        }
        function cerrarModalCrear() {
            document.getElementById('modal-crear').classList.add('hidden');
            quill.setContents([]); document.getElementById('titulo-crear').value = '';
        }

        async function agregarNota() {
            const textoPlano = quill.getText().trim();
            const tituloInput = document.getElementById('titulo-crear').value.trim();
            if (textoPlano === '' && tituloInput === '') return;

            const carpetaSelec = document.getElementById('tablero-crear').value;
            let etiquetasFinal = carpetaSelec !== 'inbox' ? [carpetaSelec] : [];

            const nueva = {
                titulo: tituloInput || `Nota ${notas.length + 1}`, texto: quill.root.innerHTML,
                tablero: 'inbox', etiquetas: etiquetasFinal, user_id: user.id
            };
            const { data, error } = await supabaseClient.from('notas').insert([nueva]).select();
            if (!error && data) { 
                notas.unshift(data[0]); 
                if(vistaActual !== 'inbox') cambiarVista('inbox');
                else { renderizarSidebar(); renderizarNotas(); }
                cerrarModalCrear(); 
            }
        }

        function serializarEstadoEdicion() {
            const titulo = document.getElementById('titulo-editar').value.trim();
            const texto = editQuill.root.innerHTML;
            const tablero = document.getElementById('tablero-editar').value;
            return JSON.stringify({ titulo, texto, tablero });
        }

        async function abrirModalEdicion(id) {
            const { data: notaActualizada, error } = await supabaseClient.from('notas').select('*').eq('id', id).single();
            if (error || !notaActualizada) { alert("Error: Nota no encontrada."); return; }

            const index = notas.findIndex(n => n.id === id);
            if (index !== -1) notas[index] = notaActualizada;
            renderizarSidebar(); renderizarNotas();

            idNotaEditando = id;
            document.getElementById('titulo-editar').value = notaActualizada.titulo || '';
            document.getElementById('tablero-editar').value = notaActualizada.etiquetas?.[0] || 'inbox';
            editQuill.clipboard.dangerouslyPasteHTML(notaActualizada.texto || '');

            document.getElementById('indicador-autoguardado').innerText = '';
            estadoUltimoGuardado = serializarEstadoEdicion();

            clearInterval(timerAutoGuardado);
            timerAutoGuardado = setInterval(ejecutarAutoGuardadoSilencioso, 60000);

            document.getElementById('modal-edicion').classList.remove('hidden');
        }

        function intentarCerrarModalEdicion() {
            if (!idNotaEditando) { cerrarModalEdicion(); return; }
            const estadoActual = serializarEstadoEdicion();
            if (estadoActual !== estadoUltimoGuardado) {
                if (!confirm("⚠️ Tienes cambios sin guardar.\n\n¿Quieres salir y perder las modificaciones?")) return;
            }
            cerrarModalEdicion();
        }

        function cerrarModalEdicion() {
            clearInterval(timerAutoGuardado); timerAutoGuardado = null;
            document.getElementById('modal-edicion').classList.add('hidden');
            idNotaEditando = null; document.getElementById('titulo-editar').value = '';
            document.getElementById('indicador-autoguardado').innerText = ''; editQuill.setContents([]);
        }

        async function ejecutarAutoGuardadoSilencioso() {
            if (!idNotaEditando) return;
            const estadoActual = serializarEstadoEdicion();
            if (estadoActual === estadoUltimoGuardado) return; 

            document.getElementById('indicador-autoguardado').innerText = 'Guardando...';
            const index = notas.findIndex(n => n.id === idNotaEditando);
            if (index === -1) return;

            const carpetaSelec = document.getElementById('tablero-editar').value;
            notas[index].titulo = document.getElementById('titulo-editar').value.trim() || 'Nota sin título';
            notas[index].texto = editQuill.root.innerHTML;
            notas[index].etiquetas = carpetaSelec !== 'inbox' ? [carpetaSelec] : [];

            await supabaseClient.from('notas').update({ 
                titulo: notas[index].titulo, texto: notas[index].texto, etiquetas: notas[index].etiquetas
            }).eq('id', idNotaEditando);

            estadoUltimoGuardado = estadoActual;
            document.getElementById('indicador-autoguardado').innerText = `Autoguardado ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            renderizarSidebar(); renderizarNotas();
        }

        async function guardarEdicion() {
            if (!idNotaEditando) return;
            clearInterval(timerAutoGuardado); timerAutoGuardado = null;
            const index = notas.findIndex(n => n.id === idNotaEditando);
            if (index === -1) return;

            const carpetaSelec = document.getElementById('tablero-editar').value;
            
            notas[index].titulo = document.getElementById('titulo-editar').value.trim() || 'Nota sin título';
            notas[index].texto = editQuill.root.innerHTML;
            notas[index].etiquetas = carpetaSelec !== 'inbox' ? [carpetaSelec] : [];
            if (notas[index].tablero !== 'inbox') notas[index].tablero = carpetaSelec;

            await supabaseClient.from('notas').update({ 
                titulo: notas[index].titulo, texto: notas[index].texto, 
                etiquetas: notas[index].etiquetas, tablero: notas[index].tablero
            }).eq('id', idNotaEditando);

            renderizarSidebar(); renderizarNotas();
            cerrarModalEdicion();
        }

        checkSession();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register(`/sw.js?v=${CURRENT_VERSION}`).then(reg => reg.update()); });
            navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
        }
    </script>
</body>
</html>
